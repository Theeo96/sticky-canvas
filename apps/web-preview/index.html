<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><link rel="stylesheet" href="style.css"><title>Sticky Canvas 웹 갤러리</title></head><body><header><h1>Sticky Canvas</h1><p>웹 갤러리 · 오프라인 미리보기</p><label class="button">작업 파일 열기<input id="file" type="file" accept=".json" hidden></label><button id="save" disabled>수정 내용 다운로드</button><span id="status" role="status">데스크톱 트레이에서 내보낸 웹 작업 파일을 열어 주세요.</span></header><main><section id="gallery" aria-label="메모 갤러리"></section><section id="detail" hidden><button id="back">← 갤러리</button><h2 id="title"></h2><div id="paper"></div><div id="editor"><p>글상자를 클릭해 내용을 수정할 수 있습니다. 배치와 사진·도형은 유지합니다.</p><div id="fields"></div></div></section></main><script src="app.js"></script></body></html>
